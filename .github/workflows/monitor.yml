name: Update Regional News Monitor
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Generate today's edition without sending email
        type: boolean
        default: true
      email_test:
        description: Send a test edition to the sender mailbox only
        type: boolean
        default: false
  schedule:
    - cron: '11,41 * * * *'
    - cron: '0 7 * * *'
      timezone: Europe/Nicosia
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: regional-news-monitor
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: regional-news-monitor/requirements.txt
      - name: Restore the previous collection and archive
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if git show-ref --verify --quiet refs/remotes/origin/monitor-state; then
            git worktree add --detach public origin/monitor-state
          else
            git worktree add --detach public HEAD
            git -C public switch --orphan monitor-state
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: argos-fr-en-v1
      - name: Install homepage parser
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Set up French translation
        continue-on-error: true
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install -r regional-news-monitor/requirements.txt
          python regional-news-monitor/install_translation.py
      - name: Build dashboard, feeds and archive
        env:
          EDITION: ${{ github.event.schedule == '0 7 * * *' || inputs.edition == true || inputs.email_test == true }}
        run: |
          args=()
          if [[ "$EDITION" == true ]]; then args+=(--edition); fi
          python regional-news-monitor/monitor.py --base https://alexkolm1.github.io/regional-news-monitor/ "${args[@]}"
      - name: Save publication state
        run: |
          git -C public config user.name 'github-actions[bot]'
          git -C public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public add -A
          if ! git -C public diff --cached --quiet; then
            git -C public commit -m 'Update newsroom feeds and archive'
            git -C public push origin HEAD:refs/heads/monitor-state
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  email:
    name: Deliver daily press review
    needs: deploy
    if: github.event.schedule == '0 7 * * *' || inputs.email_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: monitor-state
          path: public
      - name: Send with newsroom SMTP credentials
        env:
          TEST_ONLY: ${{ inputs.email_test == true }}
          NEWS_SMTP_USER: ${{ secrets.NEWS_SMTP_USER }}
          NEWS_SMTP_PASSWORD: ${{ secrets.NEWS_SMTP_PASSWORD }}
          NEWS_RECIPIENTS: ${{ secrets.NEWS_RECIPIENTS }}
          NEWS_SMTP_HOST: ${{ vars.NEWS_SMTP_HOST }}
          NEWS_SMTP_PORT: ${{ vars.NEWS_SMTP_PORT }}
        run: |
          if [[ "$TEST_ONLY" == true ]]; then
            export NEWS_RECIPIENTS="$NEWS_SMTP_USER"
          fi
          if [[ -z "$NEWS_SMTP_USER" || -z "$NEWS_SMTP_PASSWORD" || -z "$NEWS_RECIPIENTS" ]]; then
            echo 'Email credentials or recipients have not been configured.'
            if [[ "$TEST_ONLY" == true ]]; then exit 1; fi
            exit 0
          fi
          today=$(TZ=Europe/Nicosia date +%F)
          if [[ ! -s "public/archive/$today.txt" || ! -s "public/archive/$today.html" ]]; then
            echo 'The published edition for today is missing.'
            exit 1
          fi
          if [[ "$TEST_ONLY" != true ]]; then
            marker=".email-attempts/$today"
            if [[ -e "public/$marker" ]]; then
              echo 'Delivery already attempted for this edition.'
              exit 0
            fi
            mkdir -p public/.email-attempts
            touch "public/$marker"
            git -C public add "$marker"
            git -C public -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record daily email delivery attempt'
            git -C public push origin HEAD:refs/heads/monitor-state
          fi
          if ! python3 regional-news-monitor/send_edition.py >/dev/null 2>&1; then
            echo 'Email delivery failed. Check SMTP settings and confirm delivery before retrying.'
            exit 1
          fi
          echo 'SMTP accepted the edition.'
